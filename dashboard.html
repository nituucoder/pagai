<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<style>
  body{font-family:Arial,sans-serif;margin:30px}
  table{border-collapse:collapse;width:420px;margin-top:15px}
  td,th{border:1px solid #444;padding:8px;text-align:left}
  th{background:#1f4e79;color:#fff}
  .ok{color:green;font-weight:bold}
  .bad{color:red;font-weight:bold}
</style>
</head>
<body>
<h1>Admin Dashboard</h1>
<p>Street Light Detection System - Light Status</p>
<table>
  <tr><th>Light ID</th><th>Zone</th><th>Status</th></tr>
  <tr><td>#101</td><td>North Area</td><td class="ok">Working</td></tr>
  <tr><td>#102</td><td>North Area</td><td class="bad">Faulty</td></tr>
  <tr><td>#105</td><td>East Area</td><td class="ok">Working</td></tr>
</table>
</body>
</html>
